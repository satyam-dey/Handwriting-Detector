<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handwriting-to-PDF Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- CSS Variables for Easy Theming --- */
      :root {
        --primary-color: #007bff;
        --primary-hover: #0056b3;
        --background-color: #f8f9fa;
        --card-bg-color: #ffffff;
        --text-color: #333;
        --border-color: #dee2e6;
        --success-bg: #e9f7ef;
        --success-border: #a8d5b9;
        --border-radius: 8px;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      }

      /* --- General Body & Typography Styles --- */
      body {
        font-family: "Poppins", Arial, Helvetica, sans-serif;
        background-color: var(--background-color);
        color: var(--text-color);
        margin: 0;
        padding: 2rem;
        line-height: 1.6;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 2.5rem;
      }

      h1 {
        font-weight: 600;
        color: var(--primary-color);
      }

      h2 {
        font-weight: 500;
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 0.5rem;
        margin-top: 0;
        margin-bottom: 1.5rem;
      }

      /* --- Layout --- */
      .grid {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 2rem;
      }

      .card {
        background-color: var(--card-bg-color);
        padding: 2rem;
        border-radius: var(--border-radius);
        box-shadow: var(--shadow);
        transition: transform 0.2s ease-in-out;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      /* --- Forms & Interactive Elements --- */
      label {
        display: block;
        font-weight: 500;
        margin-bottom: 0.5rem;
      }

      .form-control {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        font-family: inherit;
        font-size: 1rem;
        box-sizing: border-box; /* Ensures padding doesn't affect width */
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .form-control:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .btn {
        display: inline-block;
        width: 100%;
        padding: 0.8rem 1.5rem;
        border: none;
        border-radius: var(--border-radius);
        background-color: var(--primary-color);
        color: white;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        text-align: center;
        transition: background-color 0.2s ease, transform 0.1s ease;
      }

      .btn:hover {
        background-color: var(--primary-hover);
        transform: translateY(-2px);
      }
      
      .btn-secondary {
        background-color: #6c757d;
      }
      .btn-secondary:hover {
        background-color: #5a6268;
      }

      /* --- Result & Output Areas --- */
      .result-box,
      #glyphList {
        margin-top: 1.5rem;
        padding: 1rem;
        background-color: var(--success-bg);
        border: 1px solid var(--success-border);
        border-radius: var(--border-radius);
        font-size: 0.9rem;
        word-wrap: break-word;
        white-space: pre-wrap; /* Allows line breaks */
      }
      
      #renderResult a {
        color: var(--primary-hover);
        font-weight: 600;
        text-decoration: none;
      }

      #renderResult a:hover {
        text-decoration: underline;
      }


      /* --- Responsive Design for Mobile --- */
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
        body {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Handwriting to PDF Generator ✍️</h1>
        <p>
          Upload images of your handwritten characters, then type text to generate a PDF in your own handwriting.
        </p>
      </header>

      <main class="grid">
        <section class="card">
          <h2>1. Upload Glyphs</h2>
          <form id="uploadForm">
            <div class="form-group">
              <label for="char">Character (single):</label>
              <input id="char" required maxlength="1" class="form-control" placeholder="e.g., A" />
            </div>
            <div class="form-group">
                <label for="file">Character Image:</label>
                <input id="file" type="file" accept="image/*" required class="form-control" />
            </div>
            <button type="submit" class="btn">Upload Glyph</button>
          </form>
          <div id="uploadResult" class="result-box" style="display: none;"></div>
          <hr style="border: none; border-top: 1px solid var(--border-color); margin: 2rem 0;">
          <button id="listGlyphsBtn" class="btn btn-secondary">Show Stored Glyphs</button>
          <pre id="glyphList" style="display: none;"></pre>
        </section>

        <section class="card">
          <h2>2. Type & Export</h2>
          <div class="form-group">
              <label for="textToRender">Your Text:</label>
              <textarea
                id="textToRender"
                class="form-control"
                rows="8"
                placeholder="Type the text you want to convert here..."
              ></textarea>
          </div>
          <div class="form-group">
              <label for="glyphSize">Glyph Height (in pixels):</label>
              <input id="glyphSize" type="number" value="120" class="form-control" />
          </div>
          <button id="renderBtn" class="btn">Generate PDF</button>
          <div id="renderResult" class="result-box" style="display: none;"></div>
        </section>
      </main>
    </div>

    <script>
      // The JavaScript remains the same, but we'll enhance UX by showing/hiding result boxes
      const uploadResultEl = document.getElementById("uploadResult");
      const glyphListEl = document.getElementById("glyphList");
      const renderResultEl = document.getElementById("renderResult");

      document
        .getElementById("uploadForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          uploadResultEl.style.display = 'block';
          uploadResultEl.innerText = "Uploading...";
          const char = document.getElementById("char").value;
          const file = document.getElementById("file").files[0];
          if (!char || !file) return alert("Please fill in both fields.");
          const fd = new FormData();
          fd.append("char", char);
          fd.append("file", file);
          const res = await fetch("/upload_glyph", {
            method: "POST",
            body: fd,
          });
          const j = await res.json();
          uploadResultEl.innerText = JSON.stringify(j, null, 2);
          // Clear form on success
          if(res.ok) {
            document.getElementById("uploadForm").reset();
          }
        });

      document
        .getElementById("listGlyphsBtn")
        .addEventListener("click", async () => {
          glyphListEl.style.display = 'block';
          glyphListEl.innerText = "Loading...";
          const r = await fetch("/list_glyphs");
          const j = await r.json();
          if (j.chars && j.chars.length > 0) {
            glyphListEl.innerText = j.chars.join(", ");
          } else {
            glyphListEl.innerText = "No glyphs uploaded yet.";
          }
        });

      document
        .getElementById("renderBtn")
        .addEventListener("click", async () => {
          renderResultEl.style.display = 'block';
          renderResultEl.innerHTML = "Generating PDF...";
          const text = document.getElementById("textToRender").value;
          const glyphSize = parseInt(
            document.getElementById("glyphSize").value || "120",
            10
          );
          const res = await fetch("/render_pdf", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text, font_size: glyphSize }),
          });
          const j = await res.json();
          if (j.ok) {
            renderResultEl.innerHTML = `✅ Success! <a href="${j.pdf}" target="_blank">Click here to Download PDF</a>`;
          } else {
            renderResultEl.innerText = `Error: ${JSON.stringify(j.error)}`;
          }
        });
    </script>
  </body>
</html>
